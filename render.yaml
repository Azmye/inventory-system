services:
    - type: web
      name: laravel-inventory
      env: php
      buildCommand: composer install --no-interaction --prefer-dist --optimize-autoloader && npm ci && npm run build && php artisan config:cache
      startCommand: php artisan serve --host 0.0.0.0 --port $PORT
      healthCheckPath: /
      disk:
          name: data
          mountPath: /data
          sizeGB: 1
      envVars:
          - key: APP_NAME
            value: 'Inventory Manager'
          - key: APP_ENV
            value: production
          - key: APP_KEY
            generateValue: true
          - key: APP_DEBUG
            value: false
          - key: DB_CONNECTION
            value: sqlite
          - key: DB_DATABASE
            value: /data/database.sqlite
          - key: LOG_CHANNEL
            value: stderr
          - key: LOG_LEVEL
            value: info
          - key: CACHE_DRIVER
            value: file
          - key: FILESYSTEM_DISK
            value: local
          - key: QUEUE_CONNECTION
            value: sync
          - key: SESSION_DRIVER
            value: cookie
          - key: SESSION_LIFETIME
            value: 120

    - type: worker
      name: laravel-scheduler
      env: php
      buildCommand: composer install --no-interaction --prefer-dist --optimize-autoloader
      startCommand: php artisan schedule:work
      disk:
          name: data
          mountPath: /data
          sizeGB: 1
      envVars:
          - key: APP_ENV
            value: production
          - key: APP_KEY
            fromService:
                type: web
                name: laravel-inventory
                envVarKey: APP_KEY
          - key: DB_CONNECTION
            value: sqlite
          - key: DB_DATABASE
            value: /data/database.sqlite
